# Three-turn state-carrying probe (D69) with TWO corrections instead of one (D83).
#
# D69's vehicle corrects the value exactly once, so a reversion is attributable to staleness but not to a POSITION:
# there is only one stale value to revert to. With two corrections the conversation carries the document's value and
# then a superseded correction, in a known order, and the question becomes which one a reversion goes to.
#
#   turn 1  the document establishes <key> is V0, among same-type distractors
#   turn 2  "Correction to the record: ... V1"
#   turn 3  "Correction to the record: ... V2"
#   turn 4  the question.  Gold is V2; V0 and V1 are BOTH registered as scorer distractors.
#
# `mentions_distractor` therefore keeps its existing meaning -- "answered from SOME stale state" -- on the 540 samples
# already measured with it (D69, D72, D81). WHICH stale value was answered is left to the analysis, which matches the
# recorded prediction against `meta["stale_values"]` (ordered oldest-first). Widening the scorer would have changed
# what that field means retroactively.
#
# Verified before any run: `n_updates` unset reproduces D69's fingerprint exactly, `n_updates: 2` differs, the extra
# turn pair costs about 40 cached tokens (median 2115 -> 2155), and every value in the chain occurs exactly once in
# the prompt -- which the builder now asserts for ALL of them and not only the first and last.
dataset:
  name: state_probe
  version: v0
  generator_seed: 0
  fact_types: [number, id, date, entity, constraint, tool_arg]
  context_lengths: [1024, 2048]
  depths: [0.1, 0.5, 0.9]
  groups_per_cell: 10
  n_distractors: 2
  filler_hf_id: Salesforce/wikitext
  filler_subset: wikitext-2-raw-v1
  filler_split: train
  filler_revision: b08601e04326c79dfdd32d625aee71d232d685c3
  max_new_tokens: 64
  n_updates: 2
