# GPU-free end-to-end smoke test on the REAL model (float32, CPU, short chunks).
# Not a baseline: it validates the pipeline (loading, protocol, bit accounting, JSONL, resume) while the GPU is busy.
include:
  - models/qwen3_1p7b.yaml
  - datasets/wikitext2.yaml
name: m0a_cpu_smoke
model:
  dtype: float32
  device: cpu
dataset:
  n_chunks: 3
  prefix_len: 256
  continuation_len: 64
task:
  kind: cache_ppl
  store_token_nll: true
seed: 0
