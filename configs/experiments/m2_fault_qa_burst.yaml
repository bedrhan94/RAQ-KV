# Q49 in a regime where faults have consequences. Single-bit faults at the 4-bit operating point produced zero
# task failures from code faults (D19), so the unit becomes a burst: 16 bits inside one token's head, which is
# what a corrupted memory word looks like. Roles and the metadata stratum are unchanged.
include:
  - models/qwen3_1p7b.yaml
  - datasets/raq_probe_v0.yaml
name: m2_fault_qa_burst
quantization:
  keys: {bits: 4, axis: group_token, group_size: 128}
  values: {bits: 4, axis: per_token}
task:
  kind: fault_qa
  n_samples: 150
  burst_bits: 16
  n_target: 8
  n_distractor: 6
  n_filler: 8
  n_metadata: 4
  n_control: 1
seed: 0
