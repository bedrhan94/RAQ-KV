# D86: the train-split secondary D77 pre-registered and did not run -- the only place the g=256 SIGN is reachable.
#
# H2f's recommendation rests on the perplexity cost of moving the key group from 128 to 256, and D77 bounded it at
# <=0.342% while leaving the sign unresolved: Delta NLL +0.00162 [-0.00020, +0.00341], p = 0.0739 on 145 chunks. That is
# not a power failure to fix but a CORPUS limit -- D77's own scatter puts the requirement at 181 chunks and the
# WikiText-2 TEST split supplies 145, so the contrast is unresolvable there at any n.
#
# The train split supplies enough. 400 chunks gives a half-width near 0.0011, comfortably below the 0.0016 effect.
#
# THE COST, stated because it is the reason D77 left this unrun: a different corpus partition is NOT interchangeable
# with the test split, so these absolute perplexities do not belong in the same table as every other M1 figure. What
# transfers is the PAIRED DIFFERENCE between group sizes, which is a within-chunk contrast and has no reason to depend on
# which half of WikiText the chunks come from. So this arm can establish the SIGN while its levels stay separate.
#
# PRE-REGISTERED:
#   PRIMARY   Delta NLL for g128 -> g256, paired per chunk, D31 applied. The prediction is POSITIVE (coarser is worse),
#             since that is the direction at every rung D77 measured and the only question is whether it resolves.
#   CONTROL   g128 -> g512 must reproduce D77's resolved +0.449% in direction and rough size. If it does not, the split
#             change did something the paired difference was assumed not to care about, and the primary is void.
#   REPORTED SEPARATELY, never merged: absolute perplexities, for the reason above.
include:
  - models/qwen3_1p7b.yaml
  - datasets/wikitext2.yaml
name: d86_group_ppl_train
dataset:
  split: train
  n_chunks: 400
task:
  kind: cache_ppl
  store_token_nll: true
seed: 0
sweep:
  quantization:
    - {keys: {bits: 4, axis: group_token, group_size: 128}, values: {bits: 4, axis: per_token}}
    - {keys: {bits: 4, axis: group_token, group_size: 256}, values: {bits: 4, axis: per_token}}
    - {keys: {bits: 4, axis: group_token, group_size: 512}, values: {bits: 4, axis: per_token}}
