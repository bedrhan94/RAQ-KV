# M4 gate — can the probe support retention research at all?
#
# The cheapest decisive question, run before any scorer is evaluated. This arm drops ONLY the answer-bearing
# tokens (about 1% of the cache) and keeps everything else. If accuracy survives, the target tokens are not
# load-bearing: the model recovers the fact from elsewhere in the context, no importance scorer can be
# evaluated on this probe, and M4 has to change vehicle before producing a single table. That is the D19-D21
# redundancy question, whose answer is genuinely unknown — whole-row corruption of the answer token cost only
# 2.14% of answers (D21), which is not obviously consistent with the token being necessary.
#
# The mirror arm keeps the answer tokens and fills the rest of a realistic 25% budget by recency. Run at 5%
# first, it failed 117/117 - but so did everything, because neither arm protected the attention sink, and
# dropping token 0 alone fails every answer (D32). With the sink pinned and a budget that does not destroy
# the document outright, this arm is the ceiling that any scorer at 25% is measured against.
include:
  - models/qwen3_1p7b.yaml
  - datasets/raq_probe_v0.yaml
name: m4_gate_keep_target
compression:
  scorer: oracle_keep_target
  ratio: 0.25
task:
  kind: retention
  n_samples: 120
seed: 0
