# Operating points on a downstream task. Perplexity cannot carry the claim "2-bit is usable": this project's own
# thesis is that token-level metrics understate task damage, so the operating points must be measured on the probe.
# Claim supported: the quality side of D12's operating points, and the first joint reading of precision vs
# retrieval accuracy (input to M5's allocation).
include:
  - models/qwen3_1p7b.yaml
  - datasets/raq_probe_v0.yaml
name: m1_downstream_probe
task:
  kind: qa_generate
  score_answer_nll: true
seed: 0
# Operating points are the causal (token-block) family: at equal bits it ties per-channel at 4 bits and beats it
# decisively at 2 bits (D15), and unlike per-channel it can be produced by a streaming decoder.
sweep:
  quantization:
    - {keys: {bits: 4, axis: group_token, group_size: 128}, values: {bits: 4, axis: per_token}}
    - {keys: {bits: 2, axis: group_token, group_size: 32}, values: {bits: 2, axis: per_token}}
    - {keys: {bits: 2, axis: group_token, group_size: 512}, values: {bits: 2, axis: per_token}}
