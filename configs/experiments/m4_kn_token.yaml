# M4 deployable arm — key_norm at token granularity.
#
# The cheapest possible scorer - mean key norm, no model pass at all - at token granularity.
#
# Reference points at the same 25% budget, all measured (D33/D34): recency 0.692, a perfect TOKEN oracle 0.564,
# a same-sized contiguous window in the wrong place 0.581, and the fact's own sentence 0.154. The oracle ceiling
# is what a deployable arm is measured against; beating recency alone is not the bar.
include:
  - models/qwen3_1p7b.yaml
  - datasets/raq_probe_v0.yaml
name: m4_kn_token
compression:
  scorer: key_norm
  ratio: 0.25
task:
  kind: retention
  n_samples: 120
seed: 0
